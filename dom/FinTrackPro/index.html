<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        FinPro
    </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

</head>
<body> 
    <main>
        <nav>
            <div class="navitems1"> 
                <div class="logo">LOGO</div>
                <h3 id="welcome"></h3>
            </div>
            
            <div class="navitems2">
            <div class="navcenter">
                <button id="resetData">Reset</button>
            </div>
            <div class="navbuttons">
                <button class="createbtn">Add </button>
            </div>
            <div class="settings"><i class="ri-settings-3-line"></i></div>
            
            </div>
        </nav>
        <div class="cards">
            <div class="fourcards"> 
                <div class="card income">
                    <h4 >Total income</h4>
                    <h1 id="income">$1000</h1> 
                </div>
                
                <div class="card expense">
                    <h4>Total Expense</h4> 
                    <h1 id="expense">$1000</h1> 
                </div>
                <div class="card balance">
                    <h4>Current Balance</h4>
                    <h1 id="balance">$300</h1>
                </div>
                <div class="card transactions">
                    <h4>Total Transactions</h4>
                    <h1 id="transactions"> 10</h1>
                </div>
            </div>
            <section>
                <div class="chart"> 
                    <canvas id="myChart"></canvas>
                </div>
                <div class="transactiontablediv">
                    <div class="table-controls">
                    <select id="filter">
                        <option value="All">All</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>
                    <table class="transactiontable">
                        <thead>
                        <tr>    
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th> </th>
                        </tr>
                        </thead>
                        <tbody class="transactiontablebody">
 
                        </tbody>
                    </table>
                </div>
            </section>
             <div class="modal">
                <form class="transactionInput"> 
                    <input
                    type="date"
                    id="date"
                    name="date"
                    placeholder="Date"
                    required 
                    /> 
 
                    <select id="type" name="type" required>
                    <option value="Income">Income</option>
                    <option value="Expense" selected>Expense</option> 
                    </select>
                    <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="Description"
                    required 
                    />   
                    <select id="category" name="category" required>
                    <option value="Food & Dining" selected>Food & Dining</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Recharge & Bills">Recharge & Bills</option>
                    <option value="Petrol & Auto">Petrol & Auto</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Salary">Salary</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                    </select>
                    <input
                    type="number"
                    id="amount"
                    name="amount" 
                    placeholder="Amount"
                    step="0.01"
                    required
                    />  
        
                    <button action="submit" class="savebtn">Save</button>
                </form>
            </div>
        </div>
        <div class="settingsModal">
            <div class="settingsBox">

                <h2>Settings</h2>

                <label>Name</label>
                <input type="text" id="username">

                <label>Currency</label>
                <select id="currency">
                    <option value="$">USD</option>
                    <option value="€">EUR</option>
                    <option value="£">GBP</option>
                    <option value="₹">INR</option>
                    <option value="¥">JPY</option>
                </select>
                <button id="themeBtn">Dark Mode</button>

                <button id="saveSettings">Save</button>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>

<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;

} 
html, body{
    width: 100%;
    height: 100%; 
    font-family: "Inter", sans-serif; 
}

main{
    width: 100%;
    height: 100%; 
    display: flex;
    flex-direction: column;
    position: relative;
}
nav{
    width: 100%;
    height: 6vh;  
    display: flex;
    align-items: center;
    position: fixed;
    color: white;
    background-color: rgb(185, 110, 255);
    padding: 20px; 
    box-shadow: 0 2px 4px 0 rgba(0,0,0,.2);
}
.navitems1{
    width: 50%;
    display: flex; 
    align-items: center;
    gap: 20px;
}
.navitems2{
    width: 50%;
    display: flex; 
    justify-content: flex-end;
    align-items: center;
    gap: 20px;
}
.createbtn{
    
    width: 8vw;
    height: 4vh;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: large;
    background-color:#4f46e5;
}
.cards{
    width: 100%;
    height: calc(100% - 6vh); 
    display: flex;
    flex-direction: column;
    margin-top: 6vh;
}
.fourcards{ 
    width: 100%;
    height: 15vh;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 10px; 
    font-size: x-large;
}
.card{ 
    background-color: rgb(92, 92, 179);
    color: antiquewhite;
    border-radius: 10px;
    padding: 10px;
    display: flex; 
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center; 
}
.income{
    background-color: rgb(31, 231, 164);
    color: rgb(22, 66, 198);

}
.expense{  
    background-color: #C40233;
    color: rgb(240, 244, 255);
}

.balance{
    background-color: indigo;
    color: rgb(216, 226, 255);

}
.transactions{
    background-color: rgb(15, 129, 216);
    color: rgb(240, 244, 255);

}
section{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}
.chart{
    width: 35%;
    height: 45vh; 
    padding: 10px;
    border: 1px solid black;
    display: flex; 
    align-items: center;
    border-radius: 8px;

}
.transactiontablediv{ 
    width: 63%;
    height: 45vh; 
    padding: 10px; 
    border: 1px solid black;  
    overflow: auto;  
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
}  

.transactiontable {
  width: 100%;
  border-collapse: collapse; /* Merges individual cell borders into single lines */
 
  font-size: 0.9rem;
  background-color: #ffffff;
}

.transactiontable th,
.transactiontable td {
    padding: 12px;
    text-align: left;
}
/* //header stays */
.transactiontable thead th {
    position: sticky;
    top: 0;
    background: white;
    z-index: 1;
}
.modal{
    width: 100%;
    height: 100%;
    position: absolute;
    background-color: rgba(0, 0, 0, 0.669); 
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 500;
}

.transactionInput{ 
    display: flex; 
    flex-direction: column;
    justify-content: center;
    align-items: center; 
    width: 70%;
    height: 50%;
    gap: 15px;
    background-color: white;  
    border-radius: 15px;
}
.transactionInput > input  {
    width: 70%;
    height: 30px;
    border-radius: 5px;
    border: 1px solid rgb(129, 129, 129);
    padding: 10px;
    color: rgb(28, 22, 22); 
}
select{
    
    width: 70%;
    height: 30px;
    border-radius: 2px;
    border: 1px solid rgb(129, 129, 129);
    padding: 1px;
    color: rgb(28, 22, 22); 
}
.savebtn{ 
    width: 8vw;
    height: 4vh;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: large;
    background-color:#4f46e5;
}
.deleteTransaction{ 
    width: 6vw;
    height: 2vh;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: small;
    background-color: rgb(247, 24, 24);
    }
    .settings{
        font-size: x-large;
    }
    .settingsModal{
        width: 100%;
        height: 100%;
        position: absolute;
        display: none;     
        gap: 20px;
        background-color: rgba(0, 0, 0, 0.813);
}
.settingsModal{
    position: fixed;
    inset: 0;
    display: none;           
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.55);
    z-index: 1000;
} 

.settingsBox{
    width: 350px;
    background: white;
    border-radius: 12px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    color: #222;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
}
.settingsBox h2{
    text-align: center;
}
.settingsBox input,
.settingsBox select,
.settingsBox button{
    width: 100%;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 8px;
}

#resetData {
    width: 8vw;
    height: 4vh;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: large;
    background-color:#4f46e5;
}

.settingsBox button{
    background:#4f46e5;
    color:white;
    border:none;
    cursor:pointer;
}
.settingsBox button:hover{
    background:#4338ca;
}
.settingsBox > label{
        justify-content: flex-start;

}
@media(max-width: 900px){
    nav{
        height: 5vh;
    }
    .cards{  
        margin-top:5vh; 
    }
     
    .fourcards{
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        height: 28vh;
        padding: none;  
        gap: 6px;

    }
    .fourcards > div{
        height: 100%;
        min-height: 0; 
    }
    
    .chart{
        width: 100%; 
    }


}


@media(max-width: 600px){ 
    nav{
        height: 5vh;
    } 
    .cards{  
        margin-top:5vh;    
    }
    .fourcards{
        display: grid;
        grid-template-columns: 1fr; 
        grid-template-rows: repeat(4, 1fr); 
        height: 25vh;
        padding: none;  
        gap: 6px;
        font-size: small;
    }
    .fourcards > div{
        height: 100%; 
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center; 
    }
.chart{
    width: 100%; 
}
section{
    flex-direction: column;
} 
.chart{
    width: 100%;
    
}

.transactiontablediv{ 
  width: 100%;
     
}  
 
}
body.dark{
    background:#121212;
    color:white;
}

body.dark nav{
    background:black;
}

body.dark .chart,
body.dark .transactiontablediv,
body.dark .transactionInput,
body.dark .settingsBox{
    background:#222;
    color:white;
}

body.dark .transactiontable{
    background:#2a2a2a;
    color:white;
}

body.dark .transactiontable thead th{
    background:#2a2a2a;
}

body.dark .transactiontable td{
    border-bottom:1px solid #444;
}
body.dark select{
    background:#333;
    color:white;
    border:1px solid #555;
}
body.dark .fourcards{
    background:#1a1a1a;
}
body.dark .transactionInput{
    background:#2a2a2a;
}

body.dark .transactionInput input,
body.dark .transactionInput select{
    background:#333;
    color:white;
    border:1px solid #555;
}

body.dark .income{
    background:#059669;
}

body.dark .expense{
    background:#b91c1c;
}

body.dark .balance{
    background:#5b21b6;
}

body.dark .transactions{
    background:#2563eb;
}

</style>
<script>
    const navlink1 = document.querySelector("#navlink1")
const navlink2 = document.querySelector("#navlink2")

const createBtn = document.querySelector(".createbtn")
const settings = document.querySelector(".settings")
const settingsModal = document.querySelector(".settingsModal")

const transactionType = document.querySelector("#type")
const categoryContainer = document.querySelector("#category")

const totalIncome = document.querySelector("#income")
let totalIncomeAmount = 0
const totalExpense = document.querySelector("#expense")
let totalExpenseAmount = 0
const totalBalance = document.querySelector("#balance")
let totalBalanceAmount = 0
const totalTransactions = document.querySelector("#transactions")

const inputTransaction = document.querySelector(".modal")
const saveTransaction = document.querySelector(".savebtn")

const form = document.querySelector(".transactionInput")

let myChart
const ctx = document.getElementById("myChart").getContext("2d")

const transactionTableBody = document.querySelector(".transactiontablebody")

const transcationsArr1 = JSON.parse(localStorage.getItem("transactions")) || []
const filter = document.querySelector("#filter")
const saveSettings = document.querySelector("#saveSettings")
const themeBtn = document.querySelector("#themeBtn")
const resetData = document.querySelector("#resetData")
settings.addEventListener("click", () => {
	settingsModal.style.display = "flex"
})
// 1. Raw Data Input
let transactionsArr = []
// [
// 	{
// 		date: "2026-05-01",
// 		description: "Freelance",
// 		category: "Pay",
// 		amount: 500,
// 		isDeleted: false,
// 	},
// 	{
// 		date: "2026-06-01",
// 		description: "Dinner",
// 		category: "Khana",
// 		amount: 55,
// 		isDeleted: false,
// 	},
// 	{
// 		date: "2026-07-01",
// 		description: "veggies",
// 		category: "Grocery",
// 		amount: 99,
// 		isDeleted: false,
// 	},
// 	{
// 		date: "2026-03-11",
// 		description: "Freelance",
// 		category: "Pay",
// 		amount: 500,
// 		isDeleted: false,
// 	},

// 	{
// 		date: "2026-01-11",
// 		description: "Freelance",
// 		category: "Pay",
// 		amount: 500,
// 		isDeleted: false,
// 	},
// 	{
// 		date: "2026-01-11",
// 		description: "Freelance",
// 		category: "Salary",
// 		amount: 5500,
// 		isDeleted: false,
// 	},
// ]
const categories = [
	"Food & Dining",
	"Shopping",
	"Recharge & Bills",
	"Petrol & Auto",
	"Utilities",
	"Salary",
	"Entertainment",
	"Other",
]

transactionType.addEventListener("change", () => {
	if (transactionType.value === "Income") {
		categoryContainer.style.display = "none"
		category.value = "Salary"
	} else {
		categoryContainer.style.display = "block"
	}
})

createBtn.addEventListener("click", () => {
	inputTransaction.style.display = "flex"
})

form.addEventListener("submit", (event) => {
	event.preventDefault()
	const form = event.target
	const expense = {
		id: Date.now(),
		date: form[0].value,
		type: form[1].value,
		description: form[2].value,
		category: form[3].value,
		amount: form[4].value,
		isDeleted: false,
	}

	transactionsArr.push(expense)
	localStorage.setItem("transactions", JSON.stringify(transactionsArr))

	inputTransaction.style.display = "none"
	form.reset()

	ui()
})

inputTransaction.addEventListener("click", (event) => {
	if (event.target === inputTransaction) {
		inputTransaction.style.display = "none"
	}
})
document.addEventListener("keydown", (event) => {
	if (event.key === "Escape") {
		inputTransaction.style.display = "none"
	}
})

saveSettings.addEventListener("click", () => {
	const user = document.querySelector("#username").value
	const currency = document.querySelector("#currency").value

	localStorage.setItem("username", user)
	localStorage.setItem("currency", currency)

	username.value = ""
	currency.selectedIndex = 4
	settingsModal.style.display = "none"

	ui()
})
const deleteTransaction = (id) => {
	console.log("deleteeeeeeeeeeeee")
	const trans = transactionsArr.findIndex((value) => {
		return value.id === id
	})
	console.log(id)

	console.log("index" + trans)
	transactionsArr.splice(trans, 1)
	localStorage.setItem("transactions", JSON.stringify(transactionsArr))
	ui()
}
const getChart = () => {
	const grouped = {}

	transactionsArr.forEach((t) => {
		const amt = Number(t.amount)
		if (!grouped[t.date]) {
			grouped[t.date] = {income: 0, expense: 0}
		}

		if (t.type !== "Income") {
			grouped[t.date].expense += Math.abs(amt)
		} else {
			grouped[t.date].income += Math.abs(amt)
		}
	})
	const labels = Object.keys(grouped)
	const incomeData = labels.map((d) => grouped[d].income)
	const expenseData = labels.map((d) => grouped[d].expense)
	console.log(incomeData, expenseData)

	if (myChart) {
		myChart.destroy()
		myChart = null
	}

	myChart = new Chart(ctx, {
		type: "bar",
		data: {
			labels,
			datasets: [
				{
					label: "Income",
					data: incomeData,
					backgroundColor: "rgba(0, 200, 0, 0.7)",
					borderColor: "green",
				},
				{
					label: "Expense",
					data: expenseData,
					backgroundColor: "rgba(255, 0, 0, 0.7)",
					borderColor: "red",
				},
			],
		},
	})
}
const ui = () => {
	const name = localStorage.getItem("username") || "Guest"
	document.querySelector("#welcome").innerHTML = `Welcome, ${name}`

	themeBtn.addEventListener("click", () => {
		document.body.classList.toggle("dark")

		if (document.body.classList.contains("dark")) {
			themeBtn.textContent = "🌙 Dark Mode"
		} else {
			themeBtn.textContent = "☀️ Light Mode"
		}

		localStorage.setItem("theme", document.body.classList.contains("dark"))
	})
	if (localStorage.getItem("theme") === "true") {
		document.body.classList.add("dark")
	}

	resetData.addEventListener("click", () => {
		localStorage.clear()
		transactionsArr = []
		ui()
	})

	settingsModal.addEventListener("click", (e) => {
		if (e.target === settingsModal) {
			settingsModal.style.display = "none"
		}
	})

	transactionTableBody.innerHTML = ""
	categoryContainer.style.display = "block"

	transactionsArr = JSON.parse(localStorage.getItem("transactions")) || []
	const currency = localStorage.getItem("currency") || "₹"
	totalExpenseAmount = transactionsArr.reduce((acc, item) => {
		if (item.category !== "Salary") {
			acc += Number(item.amount)
		}
		return acc
	}, 0)
	totalIncomeAmount = transactionsArr.reduce((acc, item) => {
		if (item.category === "Salary") {
			acc += Number(item.amount)
		}
		return acc
	}, 0)

	totalBalanceAmount = totalIncomeAmount - totalExpenseAmount

	totalIncome.innerHTML = currency + totalIncomeAmount
	totalExpense.innerHTML = currency + totalExpenseAmount
	totalBalance.innerHTML = currency + totalBalanceAmount

	totalTransactions.innerHTML = transactionsArr.length
	const selectedFilter = filter.value
	let filteredTransactions = transactionsArr

	if (selectedFilter !== "All") {
		filteredTransactions = transactionsArr.filter(
			(elem) => elem.type === selectedFilter,
		)
	}
	filteredTransactions.forEach((elem) => {
		console.log(elem)
		transactionTableBody.innerHTML += `                            
                            <tr> 
                                <td>${elem.date}</td>
                                <td>${elem.type}</td>
                                <td>${elem.description}</td> 
                                <td>${elem.category}</td> 
								<td>${currency}${elem.amount}</td>
                                <td>${!elem.isDeleted ? `<button class="deleteTransaction" onClick="deleteTransaction(${elem.id})">Delete</button>` : ""}</td> 
                            </tr>`
	})
	getChart()
}

filter.addEventListener("change", ui)
ui()

</script>
